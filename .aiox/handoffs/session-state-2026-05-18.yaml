# ── Strategic decisions made this session ─────────────────────────────────────
strategic_decisions:
  - decision: "Migrar camada de publicação do pipeline de Meta Graph API direto para Buffer (free plan)"
    decided_at: "2026-05-18"
    rationale: |
      Dois fatores cumulativos forçaram a decisão:
      1. Refresh do token Meta long-lived a cada 60 dias é dor recorrente — workflow
         refresh-meta-token.yml está 80% pronto mas trava em PAT GitHub sem Secrets:Write
      2. EBS é piloto de produto SaaS multi-cliente — Graph API direto teria custo de
         onboarding (30-60min/cliente) e manutenção (refresh por cliente) que escala mal
    alternatives_evaluated:
      - name: "Ayrshare"
        verdict: "Descartado por preço inicial (US$149/mês) — reavaliar se atingirmos ≥10 clientes pagantes"
      - name: "Postiz (self-hosted, open source)"
        verdict: "Descartado por exigir VPS 24/7 (Postgres + Redis + Next.js + NestJS). GitHub Actions não serve. Reavaliar com ≥20 clientes"
      - name: "Manter Graph API direto + finalizar refresh-meta-token.yml"
        verdict: "Descartado por custo composto em modelo multi-cliente"
    triggers_to_reevaluate:
      - "≥20 clientes ativos → Postiz self-hosted provavelmente paga VPS"
      - "Custo Buffer Agency (US$120/mês p/ 10 canais) > custo Postiz numa VPS"
      - "Incidente grave Buffer 'enviado mas não publicado' afetando reputação"
      - "Postiz lança MCP server oficial robusto"
    action_required_next_session: "Implementação da integração Buffer (ver next_steps)"
    impact: |
      Geração de PNGs, dashboard local, queue.json, Imagen 4 e agentes permanecem
      inalterados. Só o publicador final muda. Plano free Buffer cobre o piloto.

  - decision: "Migrar geração de imagem do dashboard de Imagen 4 para gemini-2.5-flash-image"
    decided_at: "2026-05-18"
    rationale: |
      A/B test (3 temas × 2 modelos) confirmou Imagen Fast inviável para EBS:
      bloqueia "teenager"/"child" no safety filter mesmo com BLOCK_ONLY_HIGH + ALLOW_ADULT.
      Gemini 2.5 Flash gerou todos os 3 prompts com qualidade superior. Aspect ratio
      3:4 portrait resolvido via parâmetro generationConfig.imageConfig.aspectRatio='3:4'.
    technical_finding: |
      Payload correto para Gemini image API:
      {
        contents: [{role:'user', parts:[{text: PROMPT}]}],
        generationConfig: {
          responseModalities: ['IMAGE','TEXT'],
          candidateCount: 1,
          imageConfig: { aspectRatio: '3:4' }   # ← exatamente aqui
        }
      }
      Retorna 864×1184 (~3:4 portrait). Custo $0.039/img.
    cost_comparison:
      imagen-4-fast: "$0.030/img — INVIÁVEL (safety filter)"
      gemini-2.5-flash-image: "$0.039/img — DEFAULT NOVO"
      nano-banana-pro-preview: "$0.134/img — opcional p/ premium"
    impact: |
      Dashboard precisa ser refatorado para:
      1. Branch isGemini no endpoint /api/imagen/generate
      2. Reordenar dropdown — gemini-2.5-flash-image como default
      3. Imagen mantido como fallback/legado (raramente usável)

  - decision: "Criar agente @visual-prompt (Vera) para escrever prompts cinematográficos"
    decided_at: "2026-05-18"
    rationale: |
      Prompts genéricos como 'young adult playing guitar' produzem imagens genéricas.
      Vera traduz tema/headline em prompt com linguagem de cinema (lente, iluminação,
      mood, ângulo, cenário brasileiro). Resultado A/B mostrou qualidade visivelmente
      superior (tabs no chão, golden hour, etc.) vs prompts genéricos.
    location: ".claude/skills/AIOX/agents/visual-prompt/SKILL.md"
    persona: "Vera — Diretora de Fotografia para IA, modelo claude-sonnet-4-5"
    commands: "*prompt-imagem, *prompt-variantes, *prompt-carrossel, *help"
    impact: "Pipeline EBS ganha um agente dedicado ao prompt visual, espelhando Hugo (headlines)"

  - decision: "Reconhecer EBS Aprendiz formalmente como piloto para SaaS multi-cliente"
    decided_at: "2026-05-18"
    rationale: |
      Alex explicitou que está em fase de testes para implementar para mais clientes.
      Toda decisão técnica daqui pra frente deve considerar:
      - Tempo de onboarding por cliente novo
      - Manutenção composta (decisão multiplica trabalho por N?)
      - Custo unitário por cliente/mês
      - Isolamento de falha entre clientes
      - Friction de white-label se aplicável
    action: "Memória project_saas-pilot-context.md criada com framework de avaliação"
    impact: "Critérios formais para toda recomendação técnica futura"

