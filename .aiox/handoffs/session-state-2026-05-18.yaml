    - title: "Buffer access token recebido é OIDC, não API"
      detail: |
        Token QrdNLI7j... testado em todos endpoints Buffer:
        - api.bufferapp.com/1 (v1): HTTP 401 "OIDC tokens are not accepted for direct API access"
        - api.buffer.com/2 (v2): HTTP 400 (Unsupported Content-Type — endpoint não aceita)
        - graph.buffer.com (GraphQL): "Please use api.buffer.com" + UNAUTHENTICATED
