        OIDC = OpenID Connect (token de sessão da UI Buffer), NÃO access token API.
        Para uso programático precisa OAuth flow real via developers.buffer.com:
        1. Criar app em https://developers.buffer.com/
        2. Implementar /oauth2/authorize → exchange code por access_token
        3. Token resultante funciona em Authorization: Bearer <token>
      next_steps: |
