pendencias:

  clickup_unlimited:
    status: PENDENTE_ALEX
    descricao: "Assinar plano Unlimited do ClickUp ($7/mês)"
    motivo: |
      Free plan tem limite de custom field usages (FIELD_033).
      Impacto: pautas foram criadas sem campos preenchidos (só título).
      Com Unlimited: loop-gerar.js pode setar todos os campos nos criativos sem erro.
    acao_apos_assinar: |
      1. Abrir ClickUp → ver as 14 pautas no backlog
      2. Setar manualmente: framework e pilar em cada pauta (ou rodar script)
      3. Ou criar script clickup-set-pauta-fields.js para fazer isso via API

  pautas_sem_campos:
    status: AGUARDANDO_UNLIMITED
    descricao: "14 pautas no backlog criadas sem campos preenchidos"
    workaround_atual: "Framework embutido no título (ex: '... — framework: Checklist')"
    solucao_ideal: "Setar statusPauta + framework + pilar em cada pauta via API"

  loop_gerar_teste_e2e:
    status: NÃO_TESTADO
    descricao: "Testar loop-gerar.js com uma pauta real 'Aprovada p/ Criar'"
    como_testar: |
      1. No ClickUp: abrir uma pauta → mudar status para 'Aprovada p/ Criar'
      2. npm run loop:gerar:dry   (ver o que vai gerar sem criar nada)
      3. npm run loop:gerar       (gerar de verdade)
      4. Verificar criativo no ClickUp + PNG na pasta slides/

