clickup_integration:
  metodologia: "Syncra (Pedro Valério) — 3 níveis com herança L1→L2"

  arquitetura_criada:
    workspace: "Estúdio Black Space's Workspace (90171305838)"
    space: "EBS Aprendiz (90176003844)"
    estrutura: |
      ├── 📐 L0 — Estratégico (folder: 90179269525)
      │   ├── DNA - EBS           (list: 901714407552)  ← campo: Tipo (dropdown)
      │   ├── ICP - Aluno Ideal   (list: 901714407554)  ← campo: Faixa Etária
      │   └── Ofertas             (list: 901714407556)  ← campo: Periodicidade
      ├── 🎯 L1 — Tático (folder: 90179269530)
      │   └── Campanhas           (list: 901714407567)  ← campos: Status, Framework, RegrasCaption, HashtagsBase, CTA
      └── ⚙️ L2 — Operacional (folder: 90179269535)
          ├── Pautas              (list: 901714407576)  ← campos: Status, Framework, Pilar Visual, Campanha (rel)
          ├── Criativos           (list: 901714407579)  ← campos: Formato, Programa, Plataforma, DataPublicacao,
          │                                                          Caption, Hashtags, Agente, BufferPostId,
          │                                                          Alcance, StatusPipeline, Campanha (rel), Pauta (rel)
          └── Journey Log         (list: 901714407581)

  fonte_de_verdade: "scripts/clickup-map.json"  # Todos os IDs de listas, fields e options

  arquivos_criados:
    - path: "scripts/clickup-bootstrap.js"
      descricao: |
        Script replicável (SaaS ready): cria toda a estrutura L0/L1/L2 em qualquer
        space ClickUp. Trocar CLICKUP_SPACE_ID no .env para novo cliente.
        Gera scripts/clickup-map.json ao final.

    - path: "scripts/clickup-map.json"
      descricao: |
        Fonte de verdade de TODOS os IDs (folders, lists, fields, option UUIDs).
        Consumido por scripts/clickup.js. Substitui as variáveis CLICKUP_FIELD_*
        e CLICKUP_STATUS_* do .env (que agora são legacy/stale).

    - path: "scripts/clickup.js"
      descricao: |
        Módulo principal da integração ClickUp — Metodologia Syncra.
        Funções principais:
          createCampanha(c)       → cria L1 com regras de herança
          getCampanhaRegras(id)   → lê framework/hashtags/cta/regras de uma campanha
          createCriativo(c)       → cria L2, herda hashtagsBase da campanha automaticamente
          updateStatus(id, nome)  → move criativo no pipeline (usa endpoint dedicado de field)
          journalLog(ev, id, ...)  → registra evento irremediável no Journey Log
          migrateFromQueue(path, campanhaId) → migra queue.json para ClickUp
        Funções de conveniência:
          aprovar(id), marcarAgendado(id, bufferId, data), marcarPostado(id, alcance)

  quirks_api_descobertos:
    - "ClickUp Free plan NÃO permite custom task statuses via API — usar dropdown custom field"
    - "list_relationship type_config correto: { subcategory_id: listId } (NÃO list_id)"
    - "PUT /task com custom_fields IGNORA silenciosamente dropdowns — usar POST /task/:id/field/:fieldId"
    - "Dropdown READ retorna orderindex (number) — resolver via type_config.options[value].name"
    - "Dropdown WRITE precisa de option UUID (não orderindex)"
    - "POST de custom field NÃO retorna id — sempre re-buscar com GET /list/:id/field após criar"

  dados_ao_vivo:
    campanha_teste:
      id: "86e1th44r"
      nome: "Desconstrucao de Mitos Musicais"
      framework: "Desconstrução de Mito"
