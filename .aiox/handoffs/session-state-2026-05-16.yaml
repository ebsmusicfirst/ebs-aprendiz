# ── Lições aprendidas (regras gravadas no MEMORY) ─────────────────────────────
lessons_learned:
  - lesson: "Template literal Node.js + escape sequences quebram JS no browser"
    detail: |
      Dentro de `\`...\`` (DASHBOARD_HTML), `\\n` em strings vira newline real no output.
      Mesma armadilha para `\\'`. Para evitar: usar concatenação ou `\\\\n` explícito.
      Bug recorrente — já apareceu em 2026-05-15 e 2026-05-16.
    fix_pattern: "node --check + node scripts/test-dashboard.js após qualquer edit"

  - lesson: "Imagen 4 safety filter bloqueia 'teenager/child/kid'"
    detail: "Resposta vem como `{}` (HTTP 200, sem predictions). Confunde com erro de billing."
    fix_pattern: "Usar 'young adult', 'adult', ou cenas sem pessoas"

  - lesson: "Dashboard server precisa de RESTART após edit"
    detail: "DASHBOARD_HTML é construído na inicialização. Edit no arquivo não reflete até `npx kill-port 3000` + relaunch."
    fix_pattern: "Smoke test inclui restart automático no fluxo correto"

  - lesson: "Modelo de geração de imagem Gemini exige plano pago"
    detail: |
      Free tier do Google AI Studio tem `limit: 0` para imagen-4.0-* e nano-banana-pro-preview.
      Erro 429 com mensagem confusa de quota. Solução: Pay-As-You-Go (~US$1-2/mês a 50 imgs).
    confirmed_2026_05_16: true

