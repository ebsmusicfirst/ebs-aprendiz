# ── O QUE FOI FEITO ──────────────────────────────────────

realizacoes:

  fix_github_action:
    descricao: "GitHub Action loop-publicar estava falhando em todos os runs desde 2026-06-19"
    runs_com_falha: [27960340291, 27919021577, 27903154487]
    causa_1:
      problema: "package-lock.json estava no .gitignore — npm ci exige o lock file"
      erro: "Dependencies lock file is not found in /home/runner/work/ebs-aprendiz/ebs-aprendiz"
      fix: "Removido do .gitignore, gerado com npm install --package-lock-only, commitado"
      arquivo: ".gitignore + package-lock.json"
    causa_2:
      problema: "Secrets CLICKUP_API_KEY e BUFFER_ACCESS_TOKEN contaminados com banner do dotenvx"
      erro: "Cannot convert argument to a ByteString because the character at index 0 has a value of 9671 which is greater than 255"
      explicacao: |
        Ao setar os secrets em 2026-06-19, o comando usava:
          node -e "require('dotenv').config(); process.stdout.write(process.env.KEY);" | gh secret set KEY
        O dotenvx escreve para stdout (não stderr), então o banner '◇ injected env...'
        foi capturado junto com o valor real da chave. O char '◇' = U+25C7 = 9671 decimal
        causava erro ao ser usado como header HTTP.
      fix: |
        Re-setar secrets lendo direto do arquivo .env (sem Node/dotenvx):
          node -e "const fs=require('fs'); const env=fs.readFileSync('.env','utf8'); ..." | gh secret set KEY
      arquivos_nao_mudados: "Valores corretos no .env local — só o secret do GitHub estava errado"
    resultado: "GitHub Action passando ✅ (run 27978443418 — success, 19s)"

# ── LIÇÃO APRENDIDA (importante para futuros secrets) ────

licao_secrets:
  regra: "NUNCA usar 'require(dotenv).config()' para capturar valor de env var via stdout para gh secret set"
  motivo: "dotenvx contamina stdout com banner Unicode (◇) que quebra headers HTTP"
  forma_correta: |
    node -e "
    const fs = require('fs');
    const env = fs.readFileSync('.env','utf8');
    const match = key => { const m = env.match(new RegExp('^' + key + '=(.+)', 'm')); return m ? m[1].trim() : null; };
    process.stdout.write(match('NOME_DA_CHAVE'));
    " | gh secret set NOME_DA_CHAVE

