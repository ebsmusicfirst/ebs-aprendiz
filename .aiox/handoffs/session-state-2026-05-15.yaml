# ── Completed Tasks ─────────────────────────
completed:
  - task: "Diagnóstico e correção do bug que travava todos os botões do dashboard"
    rationale: "Strings adjacentes em onclick handlers causavam SyntaxError silencioso → renderGrid quebrava e nenhum botão funcionava"
    root_cause: "Escape sequences (\\' e \\n) dentro de template literal Node.js eram processadas pelo parser do template, virando literais ' e newline real no script entregue ao browser"
    fix: "Substituído inline onclick por event delegation com data-action/data-id (sem escape hell). Escape de \\n virou \\\\n nos textos de modal."
    files:
      - scripts/dashboard.js
    verification: "Browser headless test via Preview MCP — 14 botões, 5 tipos de ação, todos disparam handlers corretamente"

  - task: "Adicionar miniaturas iframe ao vivo + painel Pexels + badge de tipo"
    files:
      - scripts/dashboard.js
    details: |
      - Cards 280px com iframe 420×525 scaled 0.6667 → navegação interativa em cada thumbnail
      - Painel Pexels com API key pré-preenchida (7jwUr8LG...) e busca portrait
      - Badge Tweet (azul) vs Editorial (dourado)

  - task: "Endpoint POST /api/carousel/:id/export + scripts/export-one.js"
    files:
      - scripts/dashboard.js
      - scripts/export-one.js
    details: |
      - Detecta tipo do carrossel (editorial via .slide vs tweet via .x-slide / carousel-track)
      - Playwright export → slides/<id>/slide_N.png
      - Atualiza queue.json com paths
      - Auto-commit + push dos PNGs e queue.json
    verification: "Testado com tweet-guitarra-sozinho-01 — 7 PNGs gerados, committed=true pushed=true"

  - task: "Auto-publisher resiliente a offline (run-scheduled.js + GitHub Action)"
    files:
      - scripts/run-scheduled.js
      - .github/workflows/post-daily.yml
    details: |
      - Cron */15 * * * * — checa fila a cada 15 min
      - Filtra carousels com status=scheduled e scheduled_for <= now (UTC)
      - Chama meta.postCarouselNow() — upload containers + publish
      - Persiste imediatamente após cada sucesso (não republica em falha parcial)
      - Auto-commit do queue.json atualizado
    secrets_required:
      - META_IG_USER_ID  # já configurado no repo
      - META_ACCESS_TOKEN  # já configurado no repo
    verification: "gh secret list confirma ambos. Dry run via lógica de filtro testada localmente."

  - task: "Fix timezone bug no agendamento"
    rationale: "datetime-local input retorna string sem timezone — Date.parse no GitHub Actions (UTC) interpretava local time como UTC, causando offset de 3h"
    fix: |
      Frontend: confirmSchedule() converte LOCAL → ISO UTC com Z via new Date(dt).toISOString()
      Backend: aceita ISO completo e armazena em scheduled_for
    files:
      - scripts/dashboard.js
    verification: "Conversão testada: 22:00 BRT → 2026-05-17T01:00:00.000Z (offset -3h correto)"

  - task: "Quality gate checklist (CTA estratégico + identidade EBS)"
    file: docs/qa-carousel-checklist.md
    rationale: "Usuário pediu refinamento de qualidade. Regra-mãe estabelecida: max 40% dos posts em sequência com CTA direto. Conteúdo prioritariamente de valor."
    sections:
      - Identidade de Marca (handle, logo, cores)
      - Tom de Voz (mentor + acessível)
      - Estratégia de CTA (proporção 2/5)
      - Preço (PROIBIDO no conteúdo)
      - Estrutura, Caption, Técnico, Visual, Localidade
    decision_matrix: "PASS / CONCERNS / WAIT / BLOCK"
    usage: "@qa lê HTML + queue.json + últimos 4 posts → emite gate"

