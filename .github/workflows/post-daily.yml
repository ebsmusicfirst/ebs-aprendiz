name: 📸 EBS Aprendiz — Postagem Diária

on:
  schedule:
    # Roda a cada hora para verificar carrosséis agendados
    # 12:00 UTC = 09:00 BRT  |  Ajuste: https://crontab.guru
    - cron: '0 * * * *'

  workflow_dispatch:
    inputs:
      confirm_post:
        description: '✅ CONFIRMAR postagem imediata do próximo aprovado? (escreva: sim)'
        required: false
        default: ''
        type: string
      dry_run:
        description: '🧪 Dry run — valida fila sem postar'
        required: false
        default: 'false'
        type: boolean

jobs:
  post:
    name: Verificar fila e postar
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🔍 Verificar fila
        id: check_queue
        run: |
          node -e "
            const q = require('./queue.json');
            const now = new Date();

            // Carrosséis aprovados (postagem imediata)
            const approved = q.carousels.filter(c => c.status === 'approved').length;

            // Carrosséis agendados prontos para publicar (scheduled_for <= agora)
            const scheduledReady = q.carousels.filter(c =>
              c.status === 'scheduled' &&
              c.meta_container_id &&
              c.scheduled_for &&
              new Date(c.scheduled_for) <= now
            ).length;

            console.log('approved=' + approved);
            console.log('scheduledReady=' + scheduledReady);
            console.log('total=' + (approved + scheduledReady));

            const fs = require('fs');
            const lines = [
              'approved=' + approved,
              'scheduled_ready=' + scheduledReady,
              'has_work=' + (approved + scheduledReady > 0 ? 'true' : 'false'),
            ];
            fs.appendFileSync(process.env.GITHUB_OUTPUT, lines.join('\n') + '\n');
          "

      - name: 📊 Resumo da verificação
        run: |
          echo "## 🔍 Verificação da Fila" >> $GITHUB_STEP_SUMMARY
          echo "- **Data:** $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- **Aprovados (imediatos):** ${{ steps.check_queue.outputs.approved }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Agendados prontos:** ${{ steps.check_queue.outputs.scheduled_ready }}" >> $GITHUB_STEP_SUMMARY

      - name: ⚠️ Nada a fazer
        if: steps.check_queue.outputs.has_work == 'false' && inputs.dry_run != 'true' && inputs.confirm_post != 'sim'
        run: |
          echo "Nenhum carrossel aprovado ou agendado pronto. Encerrando."

      - name: 🧪 Dry run
        if: inputs.dry_run == 'true'
        run: |
          echo "🧪 DRY RUN — validando fila"
          node -e "
            const q = require('./queue.json');
            const now = new Date();
            const approved = q.carousels.filter(c => c.status === 'approved');
            const scheduled = q.carousels.filter(c =>
              c.status === 'scheduled' && c.meta_container_id && c.scheduled_for && new Date(c.scheduled_for) <= now
            );
            console.log('Aprovados:', approved.length);
            approved.forEach(c => console.log(' -', c.id, '|', c.slides.length, 'slides'));
            console.log('Agendados prontos:', scheduled.length);
            scheduled.forEach(c => console.log(' -', c.id, '|', c.scheduled_for, '| container:', c.meta_container_id));
          "

      - name: 🛑 Verificar confirmação (postagem manual)
        if: |
          steps.check_queue.outputs.approved != '0' &&
          inputs.dry_run != 'true' &&
          github.event_name == 'workflow_dispatch' &&
          inputs.confirm_post != 'sim'
        run: |
          echo "::warning::Postagem manual requer confirm_post=sim. Use o cron para agendados ou preencha confirm_post."

      - name: 🚀 Executar postagem
        if: |
          inputs.dry_run != 'true' &&
          (
            steps.check_queue.outputs.has_work == 'true' &&
            (github.event_name == 'schedule' || inputs.confirm_post == 'sim')
          )
        env:
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: node scripts/post-carousel.js

      - name: 💾 Commitar queue.json atualizado
        if: |
          inputs.dry_run != 'true' &&
          (
            steps.check_queue.outputs.has_work == 'true' &&
            (github.event_name == 'schedule' || inputs.confirm_post == 'sim')
          )
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add queue.json
          git diff --staged --quiet || git commit -m "chore: atualizar status após postagem [bot]"
          git push

      - name: 📊 Resumo final
        if: always()
        run: |
          REMAINING=$(node -e "
            const q = require('./queue.json');
            const c = q.carousels.filter(c => c.status==='approved'||c.status==='scheduled').length;
            console.log(c);
          " 2>/dev/null || echo "0")
          echo "## 📸 EBS Aprendiz — Resultado" >> $GITHUB_STEP_SUMMARY
          echo "- **Carrosséis restantes (approved + scheduled):** $REMAINING" >> $GITHUB_STEP_SUMMARY
          if [ "$REMAINING" -le 2 ] 2>/dev/null; then
            echo "- **⚠️ Fila baixa** — crie novos carrosséis em breve!" >> $GITHUB_STEP_SUMMARY
          fi
