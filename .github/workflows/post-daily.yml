name: 📸 EBS Aprendiz — Auto-Publisher de Agendados

# Roda a cada 15 minutos para publicar carrosséis agendados.
# Funciona mesmo com o PC do usuário desligado — GitHub roda na nuvem.

on:
  schedule:
    - cron: '*/15 * * * *'   # a cada 15 min

  workflow_dispatch:
    inputs:
      dry_run:
        description: '🧪 Dry run — lista o que seria publicado sem chamar o Meta'
        required: false
        default: 'false'
        type: boolean

jobs:
  publish-scheduled:
    name: Publicar carrosséis agendados
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0  # commit posterior precisa de histórico

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🔍 Inspecionar fila
        id: inspect
        run: |
          node -e "
            const q = require('./queue.json');
            const now = Date.now();
            const due = q.carousels.filter(c =>
              c.status === 'scheduled' &&
              c.scheduled_for &&
              Date.parse(c.scheduled_for) <= now
            );
            const future = q.carousels.filter(c =>
              c.status === 'scheduled' &&
              c.scheduled_for &&
              Date.parse(c.scheduled_for) > now
            );
            console.log('═════════════════════════════════════════');
            console.log('Total no queue:', q.carousels.length);
            console.log('Vencidos (publicar agora):', due.length);
            console.log('Agendados para o futuro:', future.length);
            console.log('═════════════════════════════════════════');
            due.forEach(c => console.log('🔥 DUE:', c.id, '→', c.scheduled_for));
            future.forEach(c => console.log('⏳ Future:', c.id, '→', c.scheduled_for));

            const fs = require('fs');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'due_count=' + due.length + '\n');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'has_due=' + (due.length > 0 ? 'true' : 'false') + '\n');
          "

      - name: 📊 Resumo da fila
        run: |
          {
            echo "## 📋 Fila de Publicação"
            echo "- **Verificação:** $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "- **Carrosséis vencidos:** ${{ steps.inspect.outputs.due_count }}"
          } >> $GITHUB_STEP_SUMMARY

      - name: 🧪 Dry run
        if: inputs.dry_run == 'true'
        run: |
          echo "🧪 DRY RUN — nada será publicado."
          echo "Veja o passo 'Inspecionar fila' acima para detalhes."

      - name: 🚀 Publicar agendados vencidos
        if: |
          steps.inspect.outputs.has_due == 'true' &&
          inputs.dry_run != 'true'
        env:
          META_IG_USER_ID:   ${{ secrets.META_IG_USER_ID }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          GITHUB_REPO:       ${{ github.repository }}
          GITHUB_REF:        ${{ github.ref_name }}
        run: node scripts/run-scheduled.js

      - name: 💾 Commitar queue.json atualizado
        if: |
          steps.inspect.outputs.has_due == 'true' &&
          inputs.dry_run != 'true'
        run: |
          if git diff --quiet queue.json; then
            echo "queue.json não mudou — nada para commitar."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add queue.json
          git commit -m "chore: atualizar status após publicação automática [bot]"
          git push

      - name: 📊 Resumo final
        if: always()
        run: |
          REMAINING=$(node -e "
            const q = require('./queue.json');
            const c = q.carousels.filter(x => x.status==='scheduled').length;
            console.log(c);
          " 2>/dev/null || echo "?")
          {
            echo ""
            echo "## ✅ Resultado"
            echo "- **Ainda agendados:** $REMAINING"
            if [ "$REMAINING" = "0" ]; then
              echo "- **⚠️ Fila zerada** — agende novos carrosséis no dashboard local."
            fi
          } >> $GITHUB_STEP_SUMMARY
