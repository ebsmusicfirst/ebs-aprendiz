name: 📸 EBS Aprendiz — Postagem Diária

on:
  # ─────────────────────────────────────────────────────────────
  # CRON AUTOMÁTICO — desativado durante fase de testes
  # Para reativar: descomente as 3 linhas abaixo
  # ─────────────────────────────────────────────────────────────
  # schedule:
  #   # 09:00 BRT (UTC-3) = 12:00 UTC
  #   - cron: '0 12 * * *'

  # Disparo manual pelo GitHub Actions UI
  workflow_dispatch:
    inputs:
      confirm_post:
        description: '✅ CONFIRMAR POSTAGEM REAL no @aprendiz.ebs? (escreva: sim)'
        required: true
        default: ''
        type: string
      dry_run:
        description: '🧪 Dry run — apenas valida a fila, não posta'
        required: false
        default: 'false'
        type: boolean

jobs:
  post:
    name: Postar próximo carrossel
    runs-on: ubuntu-latest

    permissions:
      contents: write   # Para commitar queue.json atualizado

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🔍 Verificar fila
        id: check_queue
        run: |
          APPROVED=$(node -e "
            const q = require('./queue.json');
            const n = q.carousels.filter(c => c.status === 'approved').length;
            console.log(n);
          ")
          echo "approved=$APPROVED" >> $GITHUB_OUTPUT
          echo "Carrosséis aprovados na fila: $APPROVED"

      - name: ⚠️ Aviso fila vazia
        if: steps.check_queue.outputs.approved == '0'
        run: |
          echo "::warning::Fila de postagem vazia! Nenhum carrossel aprovado encontrado."
          echo "## ⚠️ Fila Vazia" >> $GITHUB_STEP_SUMMARY
          echo "Nenhum carrossel aprovado na fila. Crie novos carrosséis com os agentes AIOX." >> $GITHUB_STEP_SUMMARY

      - name: 🛑 Verificar confirmação
        if: steps.check_queue.outputs.approved != '0' && inputs.dry_run != 'true'
        run: |
          CONFIRM="${{ inputs.confirm_post }}"
          if [ "$CONFIRM" != "sim" ]; then
            echo "::error::Postagem NÃO confirmada. Para postar, preencha o campo 'confirm_post' com: sim"
            echo "## 🛑 Postagem Bloqueada" >> $GITHUB_STEP_SUMMARY
            echo "O campo **confirm_post** não foi preenchido com \`sim\`." >> $GITHUB_STEP_SUMMARY
            echo "Nenhum post foi realizado. Rode novamente com confirm_post = **sim** para postar." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "✅ Confirmação recebida: '$CONFIRM' — prosseguindo com postagem"

      - name: 🚀 Postar carrossel
        if: steps.check_queue.outputs.approved != '0' && inputs.dry_run != 'true'
        env:
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: node scripts/post-carousel.js

      - name: 🧪 Dry run (validação)
        if: inputs.dry_run == 'true'
        run: |
          echo "🧪 DRY RUN — Validando fila sem postar"
          node -e "
            const q = require('./queue.json');
            const next = q.carousels.find(c => c.status === 'approved');
            if (next) {
              console.log('✅ Próximo carrossel:', next.id);
              console.log('   Slides:', next.slides.length);
              console.log('   Caption:', next.caption.substring(0, 80) + '...');
            } else {
              console.log('⚠️  Nenhum carrossel aprovado');
            }
          "

      - name: 💾 Commitar queue.json atualizado
        if: steps.check_queue.outputs.approved != '0' && inputs.dry_run != 'true' && inputs.confirm_post == 'sim'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add queue.json
          git diff --staged --quiet || git commit -m "chore: marcar carrossel como publicado [bot]"
          git push

      - name: 📊 Resumo
        if: always()
        run: |
          REMAINING=$(node -e "
            const q = require('./queue.json');
            console.log(q.carousels.filter(c => c.status === 'approved').length);
          " 2>/dev/null || echo "0")
          echo "## 📸 EBS Aprendiz — Postagem Diária" >> $GITHUB_STEP_SUMMARY
          echo "- **Data:** $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- **Confirmação:** ${{ inputs.confirm_post }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Dry run:** ${{ inputs.dry_run }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Carrosséis restantes:** $REMAINING" >> $GITHUB_STEP_SUMMARY
          if [ "$REMAINING" -le 2 ] 2>/dev/null; then
            echo "- **⚠️ Alerta:** Fila baixa — crie novos carrosséis em breve!" >> $GITHUB_STEP_SUMMARY
          fi
